apiVersion: v2
name: wg-ufw
description: >-
  WireFort — a self-contained, zone-aware WireGuard VPN gateway pod. Bundles
  WireGuard (or BoringTun in userspace), the wireguard-ui web admin interface,
  and a UFW policy firewall that separates staff and customer/partner peer
  traffic, attached to the network over Multus macvlan interfaces.

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.0.0"

keywords:
  - wireguard
  - vpn
  - wireguard-ui
  - ufw
  - firewall
  - macvlan
  - multus
  - boringtun
  - networking
  - gateway

home: https://github.com/gnragoonanan/wirefort
sources:
  - https://github.com/gnragoonanan/wirefort
icon: https://raw.githubusercontent.com/gnragoonanan/wirefort/main/docs/images/icon.svg

maintainers:
  - name: gnragoonanan (GnR)
    url: https://github.com/gnragoonanan

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/gnragoonanan/wirefort
    - name: Upstream wireguard-install (Nyr)
      url: https://github.com/Nyr/wireguard-install
    - name: Upstream wireguard-ui (Khanh Ngo)
      url: https://github.com/ngoduykhanh/wireguard-ui
  artifacthub.io/images: |
    - name: wg-debianpodsysd
      image: jrei/systemd-debian:latest
    - name: wireguard-ui
      image: ngoduykhanh/wireguard-ui:latest
