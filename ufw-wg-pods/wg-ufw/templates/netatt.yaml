---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.networks.macvlan.extname }}
  namespace: {{ .Values.namespace }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "capabilities": { "ips": true },
      "master": "{{ .Values.networks.macvlan.extif }}",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { 
            "dst": "0.0.0.0/0",
            "gw": "{{ .Values.networks.defaultgw }}"
          }
        ]
      }
   }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.networks.macvlan.intname }}
  namespace: {{ .Values.namespace }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "capabilities": { "ips": true },
      "master": "{{ .Values.networks.macvlan.inif }}",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
   }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.networks.macvlan.corpname }}
  namespace: {{ .Values.namespace }}
spec:
  config: '{
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "capabilities": { "ips": true },
      "master": "{{ .Values.networks.macvlan.corpif }}",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
   }'
---
